apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: micromesh-ingress
  namespace: micromesh
spec:
  ingressClassName: nginx
  rules:
  - host: api.micromesh.com
    http:
      paths:
      - path: /auth
        pathType: Prefix
        backend:
          service:
            name: auth-service
            port:
              number: 8081
      - path: /products
        pathType: Prefix
        backend:
          service:
            name: product-service
            port:
              number: 8082
      - path: /orders
        pathType: Prefix
        backend:
          service:
            name: order-service
            port:
              number: 8083 