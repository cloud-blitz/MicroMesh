apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: micromesh
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth-service
        image: auth-service:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8081
        env:
        - name: SPRING_DATA_MONGODB_URI
          value: "mongodb://localhost:27017/auth_service_db"
        - name: JWT_SECRET
          value: "your-super-secret-jwt-key-change-in-production"
        - name: JWT_EXPIRATION
          value: "86400000"
        - name: SERVER_PORT
          value: "8081"
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: micromesh
spec:
  selector:
    app: auth-service
  ports:
  - port: 8081
    targetPort: 8081
    protocol: TCP
  type: ClusterIP 