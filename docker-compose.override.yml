# Development override file
# This file adds development-specific configurations

version: '3.8'

services:
  # Development overrides for Auth Service
  auth-service:
    environment:
      SPRING_PROFILES_ACTIVE: dev
      LOGGING_LEVEL_ROOT: DEBUG
    volumes:
      - ./auth-service:/app
      - /app/build
      - /app/.gradle

  # Development overrides for Product Service
  product-service:
    environment:
      SPRING_PROFILES_ACTIVE: dev
      LOGGING_LEVEL_ROOT: DEBUG
    volumes:
      - ./product-service:/app
      - /app/build
      - /app/.gradle

  # Development overrides for Order Service
  order-service:
    environment:
      SPRING_PROFILES_ACTIVE: dev
      LOGGING_LEVEL_ROOT: DEBUG
    volumes:
      - ./order-service:/app
      - /app/build
      - /app/.gradle

  # Development overrides for Frontend
  frontend:
    environment:
      NODE_ENV: development
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev

  # Add MongoDB Express for database management
  mongo-express:
    image: mongo-express:latest
    container_name: microservices-mongo-express
    restart: unless-stopped
    ports:
      - "8080:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: password123
      ME_CONFIG_MONGODB_URL: mongodb://admin:password123@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: password123
    depends_on:
      - mongodb
    networks:
      - microservices-network 